<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste - Ordem dos Exercícios</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background: #0f172a;
            color: #f1f5f9;
        }
        .exercise {
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 0.5rem;
            border: 2px solid #334155;
        }
        .word { border-color: #6366f1; background: rgba(99, 102, 241, 0.1); }
        .sentence { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
    </style>
</head>
<body>
    <h1>🧪 Teste - Ordem dos Exercícios</h1>
    <p>Palavras devem aparecer PRIMEIRO (azul), frases DEPOIS (verde)</p>
    
    <div id="results"></div>

    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script>
        async function testOrder() {
            const resultsDiv = document.getElementById('results');
            
            // Simular dados
            const episodeData = {
                verbos: [
                    {
                        palavra: "think",
                        traducao: "pensar",
                        exemplo_diferente: "I think coffee is good (Eu acho que café é bom)",
                        exemplo_episodio: "I just think it's a good idea (Eu só acho que é uma boa ideia)",
                        exemplo_adicional: "I think we should leave early (Acho que devemos sair cedo)"
                    },
                    {
                        palavra: "know",
                        traducao: "saber",
                        exemplo_diferente: "Do you know her name? (Você sabe o nome dela?)",
                        exemplo_episodio: "I don't know (Eu não sei)",
                        exemplo_adicional: "I know how to fix this (Eu sei como consertar isso)"
                    }
                ],
                adjetivos: [
                    {
                        palavra: "good",
                        traducao: "bom",
                        exemplo_diferente: "This is a good movie (Este é um bom filme)",
                        exemplo_episodio: "I just think it's a good idea (Eu só acho que é uma boa ideia)",
                        exemplo_adicional: "She's a good teacher (Ela é uma boa professora)"
                    }
                ]
            };

            // Iniciar game
            game.startGame('ronaldo', 's01e01', episodeData, { 
                isNewAttempt: true,
                categoryFilter: 'all'
            });

            resultsDiv.innerHTML = '<h2>Ordem dos Exercícios:</h2>';
            
            let wordCount = 0;
            let sentenceCount = 0;
            let lastWasWord = true;
            
            game.allWords.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `exercise ${item.isSentence ? 'sentence' : 'word'}`;
                
                if (item.isSentence) {
                    sentenceCount++;
                    if (lastWasWord) {
                        div.innerHTML = `<strong>--- FRASES COMEÇAM AQUI ---</strong><br>`;
                        lastWasWord = false;
                    }
                    div.innerHTML += `${index + 1}. [FRASE] ${item.sentence || item.word}`;
                } else {
                    wordCount++;
                    div.innerHTML = `${index + 1}. [PALAVRA] ${item.word} = ${item.translation}`;
                }
                
                resultsDiv.appendChild(div);
            });

            // Resumo
            const summary = document.createElement('div');
            summary.style.marginTop = '2rem';
            summary.style.padding = '1rem';
            summary.style.background = '#1e293b';
            summary.style.borderRadius = '0.5rem';
            summary.innerHTML = `
                <h3>📊 Resumo:</h3>
                <p>Total: ${game.allWords.length} exercícios</p>
                <p>Palavras: ${wordCount}</p>
                <p>Frases: ${sentenceCount}</p>
                <p><strong>${wordCount > 0 && sentenceCount > 0 && lastWasWord === false ? '✅ CORRETO: Palavras primeiro, frases depois!' : '❌ ERRO: Ordem incorreta!'}</strong></p>
            `;
            resultsDiv.appendChild(summary);
        }

        // Aguardar game carregar
        setTimeout(testOrder, 500);
    </script>
</body>
</html>
