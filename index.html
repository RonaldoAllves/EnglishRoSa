<!doctype html>
<html lang="pt-BR" data-build-version="__BUILD_VERSION__" data-app-version="__APP_VERSION__">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f8fb">
    <meta name="description" content="Pratique inglês com vocabulário e frases de The Big Bang Theory.">
    <title>English RoSa</title>
    <link rel="stylesheet" href="./css/style.css?v=__BUILD_VERSION__">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="./" data-action="home" aria-label="English RoSa - início">
                <span class="brand-name">English <strong>RoSa</strong></span>
            </a>
            <div class="topbar-actions">
                <p id="sync-status" class="sync-status" data-state="loading" role="status">Carregando...</p>
                <button id="version-status" class="version-status" type="button" data-action="check-version"
                    aria-label="Versão do aplicativo">
                    v__APP_VERSION__
                </button>
                <button id="profile-chip" class="profile-chip" type="button" data-action="show-profiles" hidden></button>
            </div>
        </header>

        <main id="app-content" class="screen" aria-live="polite">
            <section class="loading-state" aria-busy="true">
                <span class="loading-mark">ER</span>
                <p>Preparando seus episódios...</p>
            </section>
        </main>

        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <input id="backup-file" type="file" accept="application/json,.json" hidden>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script type="module" src="./js/app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
