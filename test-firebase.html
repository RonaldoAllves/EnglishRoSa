<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Firebase</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background: #0f172a;
            color: #f1f5f9;
        }
        .status {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
            border: 2px solid #334155;
        }
        .success { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .error { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>
    <h1>🔥 Teste de Carregamento Firebase</h1>
    <div id="status"></div>
    <div id="episodes"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const statusDiv = document.getElementById('status');
        const episodesDiv = document.getElementById('episodes');

        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = `status ${isError ? 'error' : 'success'}`;
            div.textContent = message;
            statusDiv.appendChild(div);
            console.log(message);
        }

        async function testFirebase() {
            try {
                // 1. Verificar se Firebase carregou
                if (typeof firebase === 'undefined') {
                    log('❌ Firebase não carregou do CDN', true);
                    return;
                }
                log('✅ Firebase SDK carregado');

                // 2. Inicializar Firebase
                const firebaseConfig = {
                    apiKey: "AIzaSyB68ABMAJJ1uFgPU5-rnJrU_Mt5CUJ_2z8",
                    authDomain: "englishrosa-a3e97.firebaseapp.com",
                    databaseURL: "https://englishrosa-a3e97-default-rtdb.firebaseio.com",
                    projectId: "englishrosa-a3e97",
                    storageBucket: "englishrosa-a3e97.firebasestorage.app",
                    messagingSenderId: "968363251419",
                    appId: "1:968363251419:web:585eb3baffa2589ad61efe"
                };

                firebase.initializeApp(firebaseConfig);
                log('✅ Firebase inicializado');

                // 3. Testar conexão
                const connectedRef = firebase.database().ref('.info/connected');
                connectedRef.on('value', (snapshot) => {
                    if (snapshot.val() === true) {
                        log('✅ Conectado ao Firebase Realtime Database');
                    } else {
                        log('⚠️ Desconectado do Firebase');
                    }
                });

                // 4. Tentar carregar episódios do Firebase
                log('📥 Tentando carregar episódios do Firebase...');
                const episodiosRef = firebase.database().ref('episodios');
                const snapshot = await episodiosRef.once('value');

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    log(`✅ Episódios carregados do Firebase! Total: ${data.episodios?.length || 0}`);
                    episodesDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>`;
                } else {
                    log('⚠️ Nenhum dado no Firebase, carregando do arquivo local...');
                    
                    // 5. Carregar do arquivo local
                    const response = await fetch('episodios.json');
                    const data = await response.json();
                    log(`✅ Episódios carregados do arquivo local! Total: ${data.episodios?.length || 0}`);
                    
                    // 6. Salvar no Firebase
                    log('💾 Salvando no Firebase...');
                    await episodiosRef.set(data);
                    log('✅ Episódios salvos no Firebase!');
                }

            } catch (error) {
                log(`❌ Erro: ${error.message}`, true);
                console.error(error);
            }
        }

        // Executar teste
        testFirebase();
    </script>
</body>
</html>
