<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Carregamento de Dados</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: #0f172a;
            color: #f1f5f9;
        }
        h1 { color: #6366f1; }
        .status { 
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
            border: 2px solid;
        }
        .success { 
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }
        .error { 
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }
        pre {
            background: #1e293b;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-size: 0.85rem;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem;
        }
        button:hover {
            background: #4f46e5;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .stat-box {
            background: #1e293b;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #6366f1;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h1>🧪 Teste de Carregamento</h1>
    
    <div id="status" class="status">
        <strong>Status:</strong> Carregando...
    </div>

    <div>
        <button onclick="testLoadData()">🔄 Recarregar Dados</button>
        <button onclick="testStorage()">💾 Testar Storage</button>
        <button onclick="clearStorage()">🗑️ Limpar Storage</button>
    </div>

    <div id="stats"></div>
    
    <h2>📊 Dados Carregados</h2>
    <div id="data"></div>

    <h2>💾 Dados do Storage</h2>
    <div id="storage-data"></div>

    <script>
        async function testLoadData() {
            const statusDiv = document.getElementById('status');
            const dataDiv = document.getElementById('data');
            const statsDiv = document.getElementById('stats');
            
            try {
                statusDiv.className = 'status';
                statusDiv.innerHTML = '<strong>Status:</strong> Carregando episodios.json...';
                
                const response = await fetch('episodios.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Calcular estatísticas
                const totalEpisodes = data.episodios?.length || 0;
                let totalWords = 0;
                let totalAdjetivos = 0;
                let totalSubstantivos = 0;
                let totalVerbos = 0;
                let totalExpressoes = 0;
                
                if (data.episodios) {
                    data.episodios.forEach(ep => {
                        const adj = ep.adjetivos?.length || 0;
                        const sub = ep.substantivos?.length || 0;
                        const ver = ep.verbos?.length || 0;
                        const exp = ep.expressoes?.length || 0;
                        
                        totalAdjetivos += adj;
                        totalSubstantivos += sub;
                        totalVerbos += ver;
                        totalExpressoes += exp;
                        totalWords += adj + sub + ver + exp;
                    });
                }
                
                // Mostrar status de sucesso
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <strong>✅ Sucesso!</strong><br>
                    Arquivo carregado corretamente<br>
                    <small>Série: ${data.serie || 'N/A'} - Temporada ${data.temporada || 'N/A'}</small>
                `;
                
                // Mostrar estatísticas
                statsDiv.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-number">${totalEpisodes}</div>
                            <div class="stat-label">Episódios</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${totalWords}</div>
                            <div class="stat-label">Palavras Total</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${totalAdjetivos}</div>
                            <div class="stat-label">Adjetivos</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${totalSubstantivos}</div>
                            <div class="stat-label">Substantivos</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${totalVerbos}</div>
                            <div class="stat-label">Verbos</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${totalExpressoes}</div>
                            <div class="stat-label">Expressões</div>
                        </div>
                    </div>
                `;
                
                // Mostrar primeiros 2 episódios como preview
                dataDiv.innerHTML = '<h3>Preview (primeiros 2 episódios):</h3>';
                if (data.episodios && data.episodios.length > 0) {
                    const preview = data.episodios.slice(0, 2);
                    dataDiv.innerHTML += '<pre>' + JSON.stringify(preview, null, 2) + '</pre>';
                }
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <strong>❌ Erro!</strong><br>
                    ${error.message}<br>
                    <small>Verifique se o arquivo episodios.json está na mesma pasta que test.html</small>
                `;
                dataDiv.innerHTML = '';
                statsDiv.innerHTML = '';
                console.error('Erro ao carregar:', error);
            }
        }

        function testStorage() {
            const storageDiv = document.getElementById('storage-data');
            
            try {
                // Testar localStorage
                const testKey = 'test_' + Date.now();
                localStorage.setItem(testKey, 'test');
                localStorage.removeItem(testKey);
                
                // Obter dados dos perfis
                const ronaldo = localStorage.getItem('ronaldo');
                const sarah = localStorage.getItem('sarah');
                
                let html = '<h3>✅ localStorage funciona!</h3>';
                
                // Mostrar dados do Ronaldo
                if (ronaldo) {
                    const data = JSON.parse(ronaldo);
                    html += '<h4>👨‍💻 Ronaldo:</h4>';
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    html += '<p>📭 Ronaldo: Sem dados salvos</p>';
                }
                
                // Mostrar dados da Sarah
                if (sarah) {
                    const data = JSON.parse(sarah);
                    html += '<h4>👩‍💼 Sarah:</h4>';
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    html += '<p>📭 Sarah: Sem dados salvos</p>';
                }
                
                storageDiv.innerHTML = html;
                
            } catch (error) {
                storageDiv.innerHTML = `
                    <div class="status error">
                        <strong>❌ Erro no Storage!</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        function clearStorage() {
            if (confirm('Tem certeza que deseja limpar TODOS os dados? Isso não pode ser desfeito!')) {
                localStorage.removeItem('ronaldo');
                localStorage.removeItem('sarah');
                alert('✅ Dados limpos! Recarregue a página.');
                location.reload();
            }
        }

        // Carregar automaticamente ao abrir a página
        window.addEventListener('DOMContentLoaded', () => {
            testLoadData();
            testStorage();
        });
    </script>
</body>
</html>
