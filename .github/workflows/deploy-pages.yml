name: Deploy English RoSa to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Prepare the site and deployment version
        shell: bash
        run: |
          mkdir _site
          cp -R index.html css js dados images _site/
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD_VERSION__/${short_sha}/g" _site/index.html _site/js/*.js _site/css/*.css
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' "$short_sha" "$GITHUB_SHA" "$built_at" > _site/version.json

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
